trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: terraform-secrets
  - name: backendResourceGroup
    value: 'grp-terraform-data'
  - name: backendStorageAccount
    value: 'stgaccountterrafomdata'
  - name: backendContainer
    value: 'tfstate'
  - name: backendKey
    value: 'platform.terraform.tfstate'
  # 👇 L'ID de ton abonnement Azure (indispensable pour Terraform)
  - name: subscriptionId
    value: 'a56f5503-7af4-45e6-8f96-dd6c75a8883d'

stages:
  - stage: Validate
    displayName: 'Validate Terraform'
    jobs:
      - job: TerraformValidate
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'
          
          - script: |
              terraform init -backend=false
              terraform validate
            displayName: 'Terraform Init & Validate'

  - stage: Plan
    displayName: 'Terraform Plan'
    dependsOn: Validate
    jobs:
      - job: TerraformPlan
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - task: AzureCLI@2
            inputs:
              # 👇 LE NOM EST EN DUR ICI (pas de variable)
              azureSubscription: 'Azure-SaaS-Connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # On donne l'ID d'abonnement à Terraform
                export ARM_SUBSCRIPTION_ID=$(subscriptionId)
                
                terraform init \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=$(backendKey)"
                
                terraform plan -out=tfplan
            displayName: 'Terraform Plan'
          
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/tfplan'
              artifact: 'tfplan'
            displayName: 'Publier le plan'

  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - deployment: TerraformApply
        environment: 'Production-Infra'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: 'latest'

                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifact: 'tfplan'
                    path: '$(System.DefaultWorkingDirectory)'

                - task: AzureCLI@2
                  inputs:
                    # 👇 LE NOM EST EN DUR ICI AUSSI
                    azureSubscription: 'Azure-SaaS-Connection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      export ARM_SUBSCRIPTION_ID=$(subscriptionId)
                      
                      terraform init \
                        -backend-config="resource_group_name=$(backendResourceGroup)" \
                        -backend-config="storage_account_name=$(backendStorageAccount)" \
                        -backend-config="container_name=$(backendContainer)" \
                        -backend-config="key=$(backendKey)"
                      
                      terraform apply -auto-approve tfplan
                  displayName: 'Terraform Apply'